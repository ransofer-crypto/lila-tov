<!DOCTYPE html><html lang="he" dir="rtl" style="background:#15110d"><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><link rel="preconnect" href="https://esm.sh" crossorigin><link rel="preconnect" href="https://api.elevenlabs.io" crossorigin><link rel="modulepreload" href="https://esm.sh/@elevenlabs/client@0.16.0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#15110d">
<title>המשרד של המאמן</title>
<meta property="og:title" content="FOOTBALL LEGEND · המשרד של המאמן"><meta property="og:description" content="חמישה משחקים בלי שער. גיא פרידמן מחכה לך במשרד.">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#15110d;color:#f3efe6;font-family:-apple-system,"Heebo",system-ui,sans-serif;touch-action:manipulation}
#bg{position:fixed;inset:0;background:
 radial-gradient(ellipse 70% 45% at 78% 18%,rgba(255,196,120,.22),transparent 70%),
 radial-gradient(ellipse 90% 60% at 50% 110%,rgba(0,0,0,.65),transparent 70%),
 linear-gradient(180deg,#2a2119 0%,#1c1612 55%,#110d0a 100%)}
.board{position:fixed;top:calc(13vh + env(safe-area-inset-top));left:50%;width:min(78vw,360px);aspect-ratio:1.7;transform:translateX(-50%);opacity:.13;border:2px solid #f3efe6;border-radius:4px}
.board::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #f3efe6}
.board::after{content:"";position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:2px solid #f3efe6;border-radius:50%;transform:translate(-50%,-50%)}
.top{position:fixed;top:calc(22px + env(safe-area-inset-top));left:0;right:0;text-align:center;z-index:3}
.top small{display:block;font-size:11px;letter-spacing:.14em;color:#e9c46a;font-weight:700}
.top b{display:block;font-size:16px;font-weight:700;margin-top:3px}.top span{display:block;font-size:13px;opacity:.6;margin-top:2px;font-variant-numeric:tabular-nums;min-height:16px}
.orbw{position:fixed;left:0;right:0;top:34vh;display:flex;flex-direction:column;align-items:center;z-index:3}
.orb{position:relative;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.22),rgba(255,255,255,.06) 70%);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;cursor:pointer}
.core{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff1cc,#e9c46a 60%,#c99a3a);box-shadow:0 0 30px rgba(233,196,106,.6);transition:width .3s,height .3s,background .3s}
.ring{position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(255,255,255,.12);border-top-color:#e9c46a;animation:spin 1.1s linear infinite;display:none}@keyframes spin{to{transform:rotate(360deg)}}
.st{margin-top:22px;font-size:17px;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.cap{margin:10px 28px 0;text-align:center;font-size:15px;line-height:1.6;opacity:.75;min-height:48px;max-width:420px}
.bars{display:none;gap:4px;align-items:center;height:22px;margin-top:14px}.bars i{width:4px;height:6px;border-radius:2px;background:#fff;opacity:.85;transition:height .08s}
body.conn .ring{display:block}body.conn .core{opacity:.35;box-shadow:none}
body.speaking .orb::before,body.speaking .orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(233,196,106,.45);animation:wave 1.8s ease-out infinite}body.speaking .orb::after{animation-delay:.9s}
@keyframes wave{from{transform:scale(.92);opacity:.9}to{transform:scale(1.35);opacity:0}}
body.listening .core{width:40px;height:40px;background:radial-gradient(circle,#fff,#e8e2d6);box-shadow:0 0 18px rgba(255,255,255,.4)}body.listening .bars{display:flex}
body.idle .core{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.12)}}
body.done .orb{opacity:.75}body.done .core{background:#8a8172;box-shadow:none;width:50px;height:50px}
.end{position:fixed;bottom:calc(42px + env(safe-area-inset-bottom));left:0;right:0;margin:auto;width:76px;height:76px;border-radius:50%;background:#FA3D5E;border:0;display:grid;place-items:center;box-shadow:0 10px 30px rgba(250,61,94,.4);z-index:3}
.end svg{width:32px;height:32px}.endl{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12px;opacity:.7;z-index:3}
.again{position:fixed;bottom:calc(52px + env(safe-area-inset-bottom));left:0;right:0;margin:auto;width:220px;height:50px;border-radius:999px;background:#e9c46a;color:#15110d;border:0;display:none;place-items:center;font:800 16px/1 inherit;z-index:3}
body.done .again{display:grid}body.done .end,body.done .endl,body.idle .end,body.idle .endl{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body class="idle">
<div id="bg"></div><div class="board"></div>
<div class="top"><small>FOOTBALL LEGEND</small><b>גיא פרידמן · המאמן</b><span id="tm"></span></div>
<div class="orbw"><div class="orb" id="orb"><i class="ring"></i><div class="core" id="core"></div></div><div class="st" id="st">לחץ על העיגול כדי להיכנס למשרד</div><div class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i></div><div class="cap" id="cap">חמישה משחקים בלי שער. בשבת באר שבע. המאמן מחכה לך.</div></div>
<button class="end" id="end" aria-label="סיום שיחה"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.996.996 0 0 1 0-1.41C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28a11.27 11.27 0 0 0-2.67-1.85.996.996 0 0 1-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg></button>
<div class="endl">סיום שיחה</div>
<button class="again" id="again">לדבר שוב</button>
<script type="module">
import {Conversation} from "https://esm.sh/@elevenlabs/client@0.16.0";
const AGENT="agent_9601m77htbj8f5497rdqmhrwkdr3";
const $=id=>document.getElementById(id),B=document.body;
let conv=null,t0=0,tmr=0,raf=0,ended=false,busy=false,wl=null,kv=null;
function keepVid(on){try{if(on){if(!kv){kv=document.createElement("video");kv.src="../keepawake.mp4";kv.muted=true;kv.loop=true;kv.setAttribute("playsinline","");kv.setAttribute("muted","");kv.style.cssText="position:fixed;width:1px;height:1px;opacity:.01;pointer-events:none;bottom:0;left:0";document.body.appendChild(kv)}kv.play().catch(()=>{})}else if(kv){kv.pause()}}catch(_){}}
async function wake(){if(ended)return;keepVid(true);try{if(navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}}catch(_){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&t0&&!ended)wake()});
const setMode=m=>B.className=m;
function finish(){if(ended)return;ended=true;busy=false;try{wl&&wl.release()}catch(_){}wl=null;keepVid(false);clearInterval(tmr);cancelAnimationFrame(raf);setMode("done");$("st").textContent="השיחה הסתיימה";$("cap").textContent=""}
function tick(){const s=Math.floor((Date.now()-t0)/1000);$("tm").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function levels(){if(!conv)return;const bars=[...$("bars").children];
  try{if(B.classList.contains("listening")){const v=conv.getInputVolume?conv.getInputVolume():0;bars.forEach((b,i)=>b.style.height=(6+Math.min(1,v*(1.2+((i*37)%5)/4))*18)+"px")}
    else if(B.classList.contains("speaking")){const v=conv.getOutputVolume?conv.getOutputVolume():0;$("core").style.transform="scale("+(0.9+Math.min(.35,v*.8))+")"}}catch(_){}
  raf=requestAnimationFrame(levels)}
async function start(){
  if(busy)return;busy=true;ended=false;t0=0;$("tm").textContent="";
  setMode("conn");$("st").textContent="נכנס למשרד…";$("cap").textContent="";
  try{
    conv=await Conversation.startSession({agentId:AGENT,connectionType:"webrtc",
      onConnect:()=>{t0=Date.now();wake();tick();tmr=setInterval(tick,1000);setMode("speaking");$("st").textContent="המאמן מדבר";levels()},
      onModeChange:({mode})=>{if(ended)return;$("core").style.transform="";if(mode==="speaking"){setMode("speaking");$("st").textContent="המאמן מדבר"}else{setMode("listening");$("st").textContent="המאמן מקשיב"}},
      onDisconnect:()=>finish(),
      onError:e=>console.error(e)});
  }catch(e){console.error(e);busy=false;setMode("idle");$("st").textContent=e&&e.name==="NotAllowedError"?"צריך לאשר את המיקרופון. לחץ כדי לנסות שוב":"לחץ על העיגול כדי לנסות שוב"}
}
$("orb").onclick=()=>{keepVid(true);if(B.classList.contains("idle"))start()};
$("again").onclick=()=>{keepVid(true);start()};
$("end").onclick=async()=>{try{await conv?.endSession()}catch(_){}finish()};
</script><script>["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});</script></body></html>
